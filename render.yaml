services:
  - type: web
    name: hearth-ui
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run ui/app.py --server.port $PORT --server.address 0.0.0.0
    envVars:
      - key: FAMILY_NAME
        sync: false
      - key: PARENT_NAME
        sync: false
      - key: PARENT_EMAIL
        sync: false
      - key: CHILDREN
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: POWER_AUTOMATE_WEBHOOK
        sync: false
      - key: LANGSMITH_API_KEY
        sync: false
      - key: LANGSMITH_TRACING
        value: "false"
      - key: DATA_DIR
        value: data

  - type: worker
    name: hearth-scheduler
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn scheduler.nudge_scheduler:app --host 0.0.0.0 --port ${API_PORT:-8000}
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: POWER_AUTOMATE_WEBHOOK
        sync: false
      - key: NUDGE_SCAN_HOUR
        value: "7"
      - key: NUDGE_SCAN_MINUTE
        value: "0"
